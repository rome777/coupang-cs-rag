<svg xmlns="http://www.w3.org/2000/svg" width="380" height="64" viewBox="0 0 380 64" fill="none">
  <defs>
    <!-- 배경 프리미엄 그라디언트 (쿠팡 블루 계열) -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080FF" />
      <stop offset="50%" stop-color="#0066E0" />
      <stop offset="100%" stop-color="#004BB5" />
    </linearGradient>
    
    <!-- 부드러운 3D 볼륨감 하이라이트 -->
    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- 고급스러운 섀도우 효과 -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0052CC" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- 메인 캡슐 버튼 본체 -->
  <rect x="8" y="6" width="364" height="50" rx="25" fill="url(#btnGrad)" filter="url(#shadow)" />
  <rect x="8" y="6" width="364" height="25" rx="25" fill="url(#glassHighlight)" />

  <!-- 왼쪽 헤드셋 아이콘 (상담원 상징) -->
  <g transform="translate(32, 19)" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a9 9 0 0 1 18 0v10a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3" />
    <path d="M19 19a2 2 0 0 1-2 2h-1" />
  </g>

  <!-- 텍스트: 쿠팡 CS 콘솔 실시간 체험하기 -->
  <text x="70" y="38" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="17" font-weight="700" letter-spacing="-0.3px">
    쿠팡 CS 콘솔 실시간 체험하기
  </text>

  <!-- 오른쪽 화살표 뱃지 -->
  <g transform="translate(326, 21)">
    <circle cx="10" cy="10" r="11" fill="#FFFFFF" fill-opacity="0.2" />
    <path d="M8 6l4 4-4 4" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
